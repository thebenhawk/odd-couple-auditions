<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Odd Couple — Audition Sign-Up</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap');
  :root{
    --ink:#171310; --cream:#F3EAD3; --gold:#D9A441; --gold-deep:#B9812A;
    --red:#A9282A; --red-deep:#7E1C1E; --paper:#FBF6E8;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Barlow', sans-serif; background:var(--paper); color:var(--ink);
    margin:0; padding:24px 16px 60px; max-width:680px; margin:0 auto;
  }
  h1{
    font-family:'Anton', sans-serif; text-transform:uppercase; font-size:34px;
    color:var(--red-deep); text-align:center; margin:8px 0 2px; line-height:1;
  }
  .sub{text-align:center; font-family:'Barlow Condensed',sans-serif; font-weight:600; letter-spacing:.04em; color:var(--gold-deep); margin-bottom:20px;}
  .panel{background:#fff; border:2px solid var(--ink); border-radius:12px; padding:18px 18px 22px; margin-bottom:16px;}
  .section-title{
    font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase;
    letter-spacing:.06em; color:var(--red-deep); font-size:15px; border-bottom:2px solid var(--red-deep);
    padding-bottom:5px; margin:22px 0 10px;
  }
  .section-title:first-child{margin-top:0;}
  label{display:block; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.03em; margin:14px 0 6px; color:var(--red-deep);}
  .section-title + label{margin-top:0;}
  input[type=text], input[type=email], input[type=tel], input[type=number], select, textarea{
    width:100%; padding:10px 12px; border:1.5px solid #999; border-radius:8px;
    font-family:'Barlow',sans-serif; font-size:15px; background:var(--paper); color:var(--ink);
  }
  textarea{min-height:70px; resize:vertical;}
  .hint{font-size:12.5px; color:#555; margin-top:4px; font-weight:400;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  .chip-group{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;}
  .chip{
    border:1.5px solid #999; border-radius:20px; padding:7px 14px; font-size:13.5px; font-weight:600;
    cursor:pointer; user-select:none; background:var(--paper);
  }
  .chip.on{background:var(--ink); color:var(--gold); border-color:var(--ink);}

  .role-check{
    border:1.5px solid #999; border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; user-select:none;
  }
  .role-check.on{border-color:var(--red-deep); background:#fdf3ea;}
  .role-check .rname{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14.5px;}
  .role-check .rmeta{font-size:11px; font-weight:700; color:var(--red-deep); letter-spacing:.02em;}
  .role-check .rdesc{font-size:12.5px; color:#333; margin-top:2px;}

  .yn{display:flex; gap:10px; margin-top:4px;}
  .yn .chip{flex:1; text-align:center;}

  .schedule-box{background:var(--cream); border:1.5px solid var(--ink); border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.5;}
  .schedule-box b{color:var(--red-deep);}
  .schedule-box .line{margin-bottom:4px;}

  .location-banner{
    background:var(--red-deep); color:#fff; border-radius:10px; padding:14px 16px; text-align:center; margin-top:4px;
  }
  .location-banner .loc-label{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-size:12px; color:var(--gold); opacity:.95;}
  .location-banner .loc-name{font-family:'Anton',sans-serif; text-transform:uppercase; font-size:24px; line-height:1.15; margin:2px 0;}
  .location-banner .loc-note{font-size:12px; color:var(--cream); opacity:.9;}

  .prep-box{
    background:var(--cream); border:1.5px solid var(--ink); border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.5; margin-top:12px;
  }
  .prep-box b{color:var(--red-deep);}

  .day-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:8px;}
  .day-head{
    font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    font-size:13px; color:var(--red-deep); text-align:center; margin-bottom:6px;
  }
  .slot{
    border:1.5px solid #999; border-radius:8px; padding:8px 10px; text-align:center;
    cursor:pointer; font-size:13px; font-weight:600; background:var(--paper); user-select:none; margin-bottom:8px;
  }
  .slot .count{display:block; font-size:11px; font-weight:600; color:#777; margin-top:2px;}
  .slot.selected .count{color:var(--gold);}
  .slot.taken{opacity:.45; cursor:not-allowed; text-decoration:line-through;}
  .slot.selected{background:var(--ink); color:var(--gold); border-color:var(--ink);}

  .ack{display:flex; gap:10px; align-items:flex-start; margin-top:16px; cursor:pointer; user-select:none; font-size:13px; line-height:1.4;}
  .ack-box{
    flex:0 0 20px; width:20px; height:20px; border:2px solid var(--ink); border-radius:5px; margin-top:1px; background:var(--paper);
  }
  .ack.on .ack-box{background:var(--red-deep); border-color:var(--red-deep); position:relative;}
  .ack.on .ack-box::after{
    content:"✓"; color:#fff; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
  }

  button{
    width:100%; margin-top:20px; padding:14px; background:var(--red-deep); color:#fff; border:none;
    border-radius:10px; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:17px;
    letter-spacing:.04em; text-transform:uppercase; cursor:pointer;
  }
  .msg{text-align:center; font-weight:600; margin-top:10px; font-size:14px;}
  .msg.err{color:var(--red-deep);}
  .confirm{text-align:center; padding:30px 10px;}
  .confirm h2{font-family:'Anton',sans-serif; color:var(--red-deep); text-transform:uppercase;}
  details{margin-top:26px;}
  summary{cursor:pointer; font-weight:700; color:var(--gold-deep); font-size:13px; text-transform:uppercase; letter-spacing:.03em;}
  .roster-day{
    font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    font-size:12.5px; color:var(--red-deep); margin:12px 0 4px; border-bottom:1.5px solid var(--red-deep); padding-bottom:3px;
  }
  .roster-day:first-child{margin-top:0;}
  .roster-slot{
    display:flex; justify-content:space-between; font-size:13px; font-weight:700; padding:6px 0 2px;
  }
  .roster-full{color:var(--red-deep);}
  .roster-entry{font-size:12.5px; color:#444; padding:2px 0 2px 10px;}

  .manage-found{background:var(--cream); border:1.5px solid var(--ink); border-radius:8px; padding:12px; margin-top:12px; font-size:13px; line-height:1.5;}
  .manage-found b{color:var(--red-deep);}
  .manage-actions{display:flex; gap:8px; margin-top:10px;}
  .manage-actions button{margin-top:0; flex:1; font-size:13px; padding:10px;}
  .btn-secondary{background:var(--gold-deep) !important;}
  .btn-danger{background:var(--red-deep) !important;}
  .reschedule-banner{
    background:var(--gold); color:var(--ink); text-align:center; font-weight:700; font-size:13px;
    padding:8px; border-radius:8px; margin-bottom:14px; text-transform:uppercase; letter-spacing:.03em;
  }

  .waitlist-banner{
    background:var(--red-deep); color:#fff; font-size:12.5px; line-height:1.4;
    padding:10px 12px; border-radius:8px; margin:6px 0 4px; font-weight:600;
  }

  .progress-indeterminate{
    position:absolute; top:0; left:0; height:100%; width:40%; border-radius:6px;
    background:var(--red-deep); animation:progress-slide 1.1s ease-in-out infinite;
  }
  @keyframes progress-slide{
    0%{ left:-40%; }
    100%{ left:100%; }
  }
</style>
</head>
<body>

<h1>The Odd Couple</h1>
<div class="sub">Audition Sign-Up · River City Community Players</div>

<div class="panel" id="manage-panel">
  <div class="section-title" style="margin-top:0;">Already Signed Up?</div>
  <div class="hint" style="margin-bottom:8px;">Enter your confirmation code to cancel or change your audition time.</div>
  <div style="display:flex; gap:8px;">
    <input id="manage-code" type="text" placeholder="Confirmation code" style="text-transform:uppercase;" />
    <button id="manage-find" style="width:auto; margin-top:0; padding:10px 18px; white-space:nowrap;">Find</button>
  </div>
  <div id="manage-result"></div>
</div>

<div id="app"></div>

<details id="roster-details" open>
  <summary>Slot availability &amp; current sign-ups</summary>
  <div class="roster" id="roster">Loading…</div>
</details>

<script>
// ---------- Backend config ----------
// Paste your deployed Apps Script Web App URL here (ends in /exec).
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzZVdZQPhRbWfHIvv2smp7L26PGD9HIPev8Tq9zYxqAovPWLI56Cg9Qj01mTiMU39-2/exec';
// Leave blank on the real form. The DEMO copy sets this to write to a
// separate sheet tab so test submissions never mix with real ones.
const SHEET_NAME = '';

function scriptConfigured(){
  return APPS_SCRIPT_URL && !APPS_SCRIPT_URL.startsWith('YOUR_');
}

async function apiPost(action, payload){
  const body = Object.assign({action}, payload);
  if(SHEET_NAME) body.sheetName = SHEET_NAME;
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'}, // avoids a CORS preflight
    body: JSON.stringify(body)
  });
  return res.json();
}

async function apiGet(params){
  const url = new URL(APPS_SCRIPT_URL);
  Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
  if(SHEET_NAME) url.searchParams.set('sheetName', SHEET_NAME);
  const res = await fetch(url.toString());
  return res.json();
}

const SLOT_CAPACITY = 5;

const THU_SLOTS = [
  {id:'t1-630', label:'6:30 PM'}, {id:'t1-700', label:'7:00 PM'},
  {id:'t1-730', label:'7:30 PM'}, {id:'t1-800', label:'8:00 PM'},
];
const FRI_SLOTS = [
  {id:'f1-630', label:'6:30 PM'}, {id:'f1-700', label:'7:00 PM'},
  {id:'f1-730', label:'7:30 PM'}, {id:'f1-800', label:'8:00 PM'},
];
const AUDITION_SLOTS = [...THU_SLOTS, ...FRI_SLOTS];

const PRONOUNS = ['She/Her','He/Him','They/Them','Other'];

const ROLES = [
  {name:'Oscar Madison', meta:'Presenting Male · 35–55', desc:'Big-hearted, big-mouthed divorced sportswriter hosting poker night. Loud, generous, allergic to responsibility.'},
  {name:'Felix Ungar', meta:'Presenting Male · 35–55', desc:'Freshly separated, fastidiously neat, wound tight as a drum. Anxious, sensitive, exhaustingly precise.'},
  {name:'Speed', meta:'Presenting Male · 30–55', desc:'Poker-night regular with a razor tongue and zero patience.'},
  {name:'Murray', meta:'Presenting Male · 30–55', desc:'The friendly neighborhood cop at the card table. Good-natured peacemaker.'},
  {name:'Roy', meta:'Presenting Male · 30–55', desc:'Practical, penny-counting accountant type. Voice of exasperated reason.'},
  {name:'Vinnie', meta:'Presenting Male · 30–55', desc:'Mild-mannered, easily flustered member of the poker crew.'},
  {name:'Gwendolyn Pigeon', meta:'Presenting Female · 28–45', desc:'Warm, giggly, a little scattered — one half of the "Pigeon sisters" upstairs.'},
  {name:'Cecily Pigeon', meta:'Presenting Female · 28–45', desc:"Gwendolyn's equally warm, slightly more composed sister."},
];

const CREW_OPTIONS = ['Sets','Costumes','Stage Hand','Makeup','Tech'];

let slotCounts = {};
let selectedSlot = null;
let selectedPronouns = new Set();
let selectedRoles = new Set();
let selectedCrew = new Set();
let anyPart = null;
let scheduleAck = false;
let rescheduleFrom = null; // holds {record} of a booking being changed
let isSubmitting = false;

async function loadTaken(){
  slotCounts = {};
  if(!scriptConfigured()) return;
  try{
    const result = await apiGet({action: 'counts'});
    slotCounts = result.counts || {};
  }catch(e){
    console.error('Failed to load slot counts', e);
  }
}

function toggleSet(set, val, cb){
  if(set.has(val)) set.delete(val); else set.add(val);
  cb();
}

const MAX_FILE_BYTES = 4 * 1024 * 1024; // 4MB

function readFileAsPayload(inputEl){
  return new Promise((resolve, reject) => {
    const file = inputEl.files && inputEl.files[0];
    if(!file){ resolve(null); return; }
    if(file.size > MAX_FILE_BYTES){
      reject(new Error(`${file.name} is too large — please use a file under 4MB.`));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = String(reader.result).split(',')[1] || '';
      resolve({ data: base64, name: file.name, mimeType: file.type });
    };
    reader.onerror = () => reject(new Error(`Couldn't read ${file.name}.`));
    reader.readAsDataURL(file);
  });
}

function isAllSlotsFull(){
  return AUDITION_SLOTS.every(s => (slotCounts[s.id] || 0) >= SLOT_CAPACITY);
}

function render(){
  const app = document.getElementById('app');
  const r = rescheduleFrom ? rescheduleFrom.record : null;
  const allFull = !r && isAllSlotsFull();
  app.innerHTML = `
    ${r ? `<div class="reschedule-banner">Choosing a new time for ${r.name} — your current slot (${r.slotLabel}) stays reserved until you confirm</div>` : ''}
    <div class="panel">

      <div class="section-title">About You</div>
      <label>Name</label>
      <input id="name" placeholder="Full name" />

      <div class="row2">
        <div>
          <label>Email</label>
          <input id="email" type="email" placeholder="you@email.com" />
        </div>
        <div>
          <label>Phone</label>
          <input id="phone" type="tel" placeholder="(555) 555-5555" />
        </div>
      </div>

      <label>Pronouns</label>
      <div class="chip-group" id="pronouns"></div>

      <div class="row2">
        <div>
          <label>Age</label>
          <input id="age" type="number" min="16" placeholder="Age" />
        </div>
        <div>
          <label>Height</label>
          <input id="height" type="text" placeholder="e.g. 5'8&quot;" />
        </div>
      </div>

      <label>Where do you work / go to school?</label>
      <input id="workschool" placeholder="Employer or school" />

      <div class="section-title">Roles</div>
      <label>Role(s) you're interested in <span style="font-weight:400;text-transform:none;color:#777;">(select all that apply — age/gender listed is "presenting as," not a requirement)</span></label>
      <div id="roles"></div>

      <label>Are you willing to accept any part offered?</label>
      <div class="yn" id="anypart">
        <div class="chip" data-val="yes">Yes</div>
        <div class="chip" data-val="no">No</div>
      </div>

      <label>If not cast, would you be willing to help with:</label>
      <div class="chip-group" id="crew"></div>

      <div class="section-title">Prep &amp; Experience</div>
      <label>Resume &amp; headshot</label>
      <div class="hint">PDF, JPEG, or PNG — up to 4MB each. Optional, but helpful.</div>
      <div class="row2" style="margin-top:8px;">
        <div>
          <label style="margin-top:0;">Resume</label>
          <input id="resumeFile" type="file" accept=".pdf,.jpg,.jpeg,.png" />
          <div class="hint" id="resume-status"></div>
        </div>
        <div>
          <label style="margin-top:0;">Headshot</label>
          <input id="headshotFile" type="file" accept=".jpg,.jpeg,.png" />
          <div class="hint" id="headshot-status"></div>
        </div>
      </div>
      <div class="hint" style="margin-top:8px;">Don't have a resume or headshot ready? No problem — just list your notable productions and training below instead.</div>
      <textarea id="bio" style="margin-top:8px;" placeholder="Notable productions (role, theatre group) and any notable training — classes, workshops, etc."></textarea>

      <div class="section-title">Schedule</div>
      <div class="schedule-box">
        <div class="line"><b>Rehearsals:</b> Mon–Thu, 6:30–9:30 PM, Sept 14 – Oct 16 (Performing Arts Center). Not everyone is needed every night — a detailed calendar goes out after casting.</div>
        <div class="line"><b>Set construction:</b> Saturdays, 9:00 AM – Noon (crew &amp; volunteers).</div>
        <div class="line"><b>Sundays:</b> by exception only, scheduled if needed.</div>
        <div class="line"><b>Que-to-Que:</b> Sunday, Oct 18, 10:00 AM – 6:00 PM</div>
        <div class="line"><b>Tech:</b> Oct 19–22 (Costume Review Oct 21)</div>
        <div class="line"><b>Performances:</b> Fri Oct 23 · Sat Oct 24 · Sun Oct 25 (2 PM) · Fri Oct 30 · Sat Oct 31 · Sun Nov 1 (2 PM)</div>
      </div>
      <label>Conflicts during the rehearsal, tech, or performance period</label>
      <div class="hint">Please be thorough — it's difficult to make changes once the schedule is set. Include specific dates and the reason, and note anything recurring (e.g. "every Tuesday — work shift" or "Oct 24–25 — out of town").</div>
      <textarea id="conflicts" style="margin-top:8px;" placeholder="List any dates/times you're unavailable, why, and whether it recurs"></textarea>

      <div class="ack" id="ack">
        <div class="ack-box"></div>
        <div>I've reviewed the proposed schedule above and, aside from what I've listed as a conflict, I can accommodate it.</div>
      </div>

      <div class="section-title">Audition Slot</div>
      <div class="location-banner">
        <div class="loc-label">Auditions Held At</div>
        <div class="loc-name">Riverfront Community Center</div>
        <div class="loc-note">Not the same as the rehearsal location (Performing Arts Center) — see Schedule above.</div>
      </div>
      <div class="prep-box">
        <b>What to bring:</b> One 2–4 minute monologue in the tone of the show. Sides are posted online one week prior to auditions — pick a scene from one of the roles you're interested in.
      </div>
      <label>Pick an audition time</label>
      ${allFull ? `<div class="waitlist-banner">All slots are currently full — you can still sign up below and we'll add you to the waitlist. We'll automatically book you into the next opening and email you the details.</div>` : ''}
      <div class="day-grid">
        <div class="day-col">
          <div class="day-head">Thursday, Sept 10</div>
          <div id="slots-thu"></div>
        </div>
        <div class="day-col">
          <div class="day-head">Friday, Sept 11</div>
          <div id="slots-fri"></div>
        </div>
      </div>
      <div class="hint">${allFull ? 'Every slot is full right now — no need to pick one, just submit below to join the waitlist.' : '5 people per slot. Can\'t make either day work? Note it in the conflicts box above.'}</div>

      <div class="section-title">Anything Else</div>
      <label>Notes to the director</label>
      <textarea id="notes" placeholder="Optional"></textarea>

      <button id="submit">${allFull ? 'Join the Waitlist' : 'Reserve my slot'}</button>
      <div id="progress-wrap" style="display:none; margin-top:10px;">
        <div style="background:#e5ddc8; border-radius:6px; overflow:hidden; height:8px; position:relative;">
          <div id="progress-bar" class="progress-indeterminate"></div>
        </div>
        <div id="progress-label" style="text-align:center; font-size:12px; color:#777; margin-top:4px;">Submitting — this can take a moment if you attached files…</div>
      </div>
      <div id="msg" class="msg"></div>
    </div>
  `;

  // Pronouns
  const pEl = document.getElementById('pronouns');
  pEl.innerHTML = PRONOUNS.map(p => `<div class="chip" data-val="${p}">${p}</div>`).join('');
  pEl.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => {
      toggleSet(selectedPronouns, el.dataset.val, () => el.classList.toggle('on'));
    });
  });

  // Roles
  const rEl = document.getElementById('roles');
  rEl.innerHTML = ROLES.map(r => `
    <div class="role-check" data-val="${r.name}">
      <div class="rname">${r.name}</div>
      <div class="rmeta">${r.meta}</div>
      <div class="rdesc">${r.desc}</div>
    </div>`).join('');
  rEl.querySelectorAll('.role-check').forEach(el => {
    el.addEventListener('click', () => {
      toggleSet(selectedRoles, el.dataset.val, () => el.classList.toggle('on'));
    });
  });

  // Any part
  document.querySelectorAll('#anypart .chip').forEach(el => {
    el.addEventListener('click', () => {
      anyPart = el.dataset.val;
      document.querySelectorAll('#anypart .chip').forEach(c => c.classList.remove('on'));
      el.classList.add('on');
    });
  });

  // Crew
  const cEl = document.getElementById('crew');
  cEl.innerHTML = CREW_OPTIONS.map(c => `<div class="chip" data-val="${c}">${c}</div>`).join('');
  cEl.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => {
      toggleSet(selectedCrew, el.dataset.val, () => el.classList.toggle('on'));
    });
  });

  // Slots (two day columns)
  function slotHtml(s){
    const count = slotCounts[s.id] || 0;
    const full = count >= SLOT_CAPACITY;
    return `<div class="slot ${full ? 'taken' : ''}" data-id="${s.id}">${s.label}<span class="count">${full ? 'FULL' : count + '/' + SLOT_CAPACITY + ' booked'}</span></div>`;
  }
  document.getElementById('slots-thu').innerHTML = THU_SLOTS.map(slotHtml).join('');
  document.getElementById('slots-fri').innerHTML = FRI_SLOTS.map(slotHtml).join('');

  document.querySelectorAll('.slot').forEach(el => {
    el.addEventListener('click', () => {
      if(el.classList.contains('taken')) return;
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
      selectedSlot = el.dataset.id;
    });
  });

  // Schedule acknowledgment
  const ackEl = document.getElementById('ack');
  ackEl.addEventListener('click', () => {
    scheduleAck = !scheduleAck;
    ackEl.classList.toggle('on', scheduleAck);
  });

  // File pickers
  document.getElementById('resumeFile').addEventListener('change', (e) => {
    const f = e.target.files[0];
    document.getElementById('resume-status').textContent = f ? `Selected: ${f.name}` : '';
  });
  document.getElementById('headshotFile').addEventListener('change', (e) => {
    const f = e.target.files[0];
    document.getElementById('headshot-status').textContent = f ? `Selected: ${f.name}` : '';
  });

  document.getElementById('submit').addEventListener('click', submitForm);

  // Prefill when rescheduling
  if(r){
    document.getElementById('name').value = r.name || '';
    document.getElementById('email').value = r.email || '';
    document.getElementById('phone').value = r.phone || '';
    document.getElementById('age').value = r.age || '';
    document.getElementById('height').value = r.height || '';
    document.getElementById('workschool').value = r.workschool || '';
    document.getElementById('bio').value = r.bio || '';
    document.getElementById('conflicts').value = r.conflicts || '';
    document.getElementById('notes').value = r.notes || '';
  }
  document.querySelectorAll('#pronouns .chip').forEach(el => { if(selectedPronouns.has(el.dataset.val)) el.classList.add('on'); });
  document.querySelectorAll('.role-check').forEach(el => { if(selectedRoles.has(el.dataset.val)) el.classList.add('on'); });
  document.querySelectorAll('#crew .chip').forEach(el => { if(selectedCrew.has(el.dataset.val)) el.classList.add('on'); });
  document.querySelectorAll('#anypart .chip').forEach(el => { if(el.dataset.val === anyPart) el.classList.add('on'); });

  renderRoster();
}

async function renderRoster(){
  const el = document.getElementById('roster');
  if(!scriptConfigured()){
    el.innerHTML = '<div class="hint">Backend not connected yet.</div>';
    return;
  }
  try{
    const result = await apiPost('roster', {});
    const rows = (result.success && result.rows) ? result.rows : [];

    const bySlot = {};
    rows.forEach(r => {
      if(!bySlot[r.slot]) bySlot[r.slot] = [];
      bySlot[r.slot].push(r);
    });

    const dayGroups = [
      {label: 'Thursday, Sept 10', slots: THU_SLOTS},
      {label: 'Friday, Sept 11', slots: FRI_SLOTS}
    ];

    let html = '';
    dayGroups.forEach(day => {
      html += `<div class="roster-day">${day.label}</div>`;
      day.slots.forEach(s => {
        const entries = bySlot[s.id] || [];
        const count = entries.length;
        const full = count >= SLOT_CAPACITY;
        html += `<div class="roster-slot">
          <span>${s.label}</span>
          <span class="${full ? 'roster-full' : ''}">${count}/${SLOT_CAPACITY} booked${full ? ' — full' : ''}</span>
        </div>`;
        entries.forEach(d => {
          html += `<div class="roster-entry">${d.name} — ${(d.roles||[]).join(', ') || 'no role selected'}</div>`;
        });
      });
    });

    el.innerHTML = html || '<div>No sign-ups yet.</div>';
  }catch(e){
    el.innerHTML = '<div>No sign-ups yet.</div>';
  }
}

async function submitForm(){
  if(isSubmitting) return; // guards against double-clicks/double-taps

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const age = document.getElementById('age').value.trim();
  const height = document.getElementById('height').value.trim();
  const workschool = document.getElementById('workschool').value.trim();
  const bio = document.getElementById('bio').value.trim();
  const conflicts = document.getElementById('conflicts').value.trim();
  const notes = document.getElementById('notes').value.trim();
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submit');
  const progressWrap = document.getElementById('progress-wrap');

  const isReschedule = !!rescheduleFrom;
  const waitlistMode = !isReschedule && isAllSlotsFull();
  const originalBtnLabel = waitlistMode ? 'Join the Waitlist' : 'Reserve my slot';

  if(!name || !email || selectedRoles.size === 0 || (!waitlistMode && !selectedSlot)){
    msg.textContent = waitlistMode
      ? 'Please fill in your name, email, and at least one role.'
      : 'Please fill in your name, email, at least one role, and pick a slot.';
    msg.className = 'msg err';
    return;
  }
  if(!scheduleAck){
    msg.textContent = 'Please check the box confirming you can accommodate the proposed schedule.';
    msg.className = 'msg err';
    return;
  }
  if(!scriptConfigured()){
    msg.textContent = 'Sign-ups aren\'t connected yet — check back soon.';
    msg.className = 'msg err';
    return;
  }

  let resumeFile, headshotFile;
  try{
    resumeFile = await readFileAsPayload(document.getElementById('resumeFile'));
    headshotFile = await readFileAsPayload(document.getElementById('headshotFile'));
  }catch(fileErr){
    msg.textContent = fileErr.message;
    msg.className = 'msg err';
    return;
  }

  let slotLabel = null;
  if(!waitlistMode){
    const dayName = selectedSlot.startsWith('t1') ? 'Thu 9/10' : 'Fri 9/11';
    slotLabel = dayName + ' · ' + AUDITION_SLOTS.find(s => s.id === selectedSlot).label;
  }
  const payload = {
    name, email, phone, age, height, workschool,
    pronouns: Array.from(selectedPronouns),
    roles: Array.from(selectedRoles),
    anyPart, crew: Array.from(selectedCrew),
    bio, conflicts, notes
  };
  if(!waitlistMode){
    payload.slot = selectedSlot;
    payload.slotLabel = slotLabel;
  }
  if(resumeFile) payload.resumeFile = resumeFile;
  if(headshotFile) payload.headshotFile = headshotFile;

  const action = waitlistMode ? 'waitlist' : (isReschedule ? 'reschedule' : 'create');
  const actionPayload = isReschedule ? {code: rescheduleFrom.code, data: payload} : {data: payload};

  isSubmitting = true;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting…';
  msg.textContent = '';
  progressWrap.style.display = 'block';

  try{
    const result = await apiPost(action, actionPayload);
    if(!result.success){
      if(result.error === 'slot_full'){
        msg.textContent = 'That slot just filled up — please pick another.';
      }else if(result.error === 'duplicate'){
        msg.textContent = 'Looks like you\'ve already signed up with this name and email. Check your email for your confirmation code, or use the "Already Signed Up?" box above to manage your booking.';
      }else{
        msg.textContent = 'Something went wrong saving your sign-up — please try again.';
      }
      msg.className = 'msg err';
      isSubmitting = false;
      submitBtn.disabled = false;
      submitBtn.textContent = originalBtnLabel;
      progressWrap.style.display = 'none';
      await loadTaken();
      render();
      return;
    }
    const code = result.code;
    const wasWaitlisted = !!result.waitlisted;
    const finalSlotLabel = result.slotLabel || slotLabel;
    const emailNote = result.emailSent
      ? `<p class="hint">A confirmation email is on its way to ${email}.</p>`
      : `<p class="hint" style="color:var(--red-deep);">Heads up: the confirmation email wasn't sent — save your code below just in case.</p>`;

    let heading, bodyText, codeNote;
    if(wasWaitlisted){
      heading = "You're on the waitlist!";
      bodyText = `${name}, every slot is full right now. You're next in line — the moment someone cancels, we'll automatically book you in and email you the details.`;
      codeNote = 'Save this code — use it in the "Already Signed Up?" box above if you need to cancel your spot on the waitlist.';
    }else if(isReschedule){
      heading = "You're all set — time updated!";
      bodyText = `${name}, you're set for <b>${finalSlotLabel}</b>.`;
      codeNote = 'Your confirmation code stays the same as before — use it any time to manage this booking.';
    }else{
      heading = "You're booked!";
      bodyText = `${name}, you're set for <b>${finalSlotLabel}</b>.`;
      codeNote = 'Save this code — use it in the "Already Signed Up?" box above to cancel or change your time later.';
    }

    document.getElementById('app').innerHTML = `
      <div class="panel confirm">
        <h2>${heading}</h2>
        <p>${bodyText}</p>
        ${wasWaitlisted ? '' : '<p class="hint">Bring your monologue and arrive a few minutes early. See you at Riverfront Community Center!</p>'}
        ${emailNote}
        <div style="background:var(--ink); color:var(--gold); border-radius:8px; padding:12px; margin-top:14px;">
          <div style="font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--cream); opacity:.8;">Your confirmation code</div>
          <div style="font-family:'Anton',sans-serif; font-size:26px; letter-spacing:.08em;">${code}</div>
        </div>
        <p class="hint">${codeNote} This confirmation only shows once.</p>
        <button id="again" style="margin-top:14px;">Sign up someone else</button>
      </div>`;
    document.getElementById('again').addEventListener('click', () => {
      selectedSlot = null; scheduleAck = false; rescheduleFrom = null;
      selectedPronouns = new Set(); selectedRoles = new Set(); selectedCrew = new Set(); anyPart = null;
      render();
    });
    rescheduleFrom = null;
    isSubmitting = false;
    await loadTaken();
    renderRoster();
  }catch(e){
    msg.textContent = 'Something went wrong saving your sign-up — please try again.';
    msg.className = 'msg err';
    isSubmitting = false;
    submitBtn.disabled = false;
    submitBtn.textContent = originalBtnLabel;
    progressWrap.style.display = 'none';
  }
}

async function findBookingByCode(code){
  try{
    const result = await apiPost('find', {code: code.toUpperCase()});
    if(result.success) return {code: code.toUpperCase(), record: result.record, waitlisted: !!result.waitlisted};
    return null;
  }catch(e){
    return null;
  }
}

function renderManageResult(found){
  const el = document.getElementById('manage-result');
  if(!found){
    el.innerHTML = `<div class="hint" style="color:var(--red-deep); margin-top:10px;">No booking found for that code.</div>`;
    return;
  }
  const d = found.record;
  const statusLine = found.waitlisted ? 'Status: Waitlisted — no time assigned yet' : d.slotLabel;
  const rescheduleBtn = found.waitlisted ? '' : `<button id="manage-reschedule" class="btn-secondary">Pick a different time</button>`;
  el.innerHTML = `
    <div class="manage-found">
      <div><b>${d.name}</b> — ${statusLine}</div>
      <div>Roles: ${(d.roles || []).join(', ') || '—'}</div>
      <div class="manage-actions">
        <button id="manage-cancel" class="btn-danger">${found.waitlisted ? 'Leave waitlist' : 'Cancel booking'}</button>
        ${rescheduleBtn}
      </div>
    </div>`;
  document.getElementById('manage-cancel').addEventListener('click', async () => {
    const confirmMsg = found.waitlisted
      ? `Remove ${d.name} from the waitlist?`
      : `Cancel ${d.name}'s booking for ${d.slotLabel}?`;
    if(!confirm(confirmMsg)) return;
    try{
      const result = await apiPost('cancel', {code: found.code});
      if(!result.success) throw new Error('cancel failed');
      el.innerHTML = found.waitlisted
        ? `<div class="hint" style="margin-top:10px;">Removed from the waitlist.</div>`
        : `<div class="hint" style="margin-top:10px;">Booking cancelled. That slot is now open — if anyone's on the waitlist, they've just been automatically booked into it.</div>`;
      await loadTaken();
      renderRoster();
      // refresh currently-shown slot buttons if the main form isn't mid-reschedule
      if(!rescheduleFrom) render();
    }catch(e){
      el.innerHTML = `<div class="hint" style="color:var(--red-deep); margin-top:10px;">Couldn't cancel — please try again.</div>`;
    }
  });
  if(!found.waitlisted){
    document.getElementById('manage-reschedule').addEventListener('click', async () => {
      rescheduleFrom = found;
      selectedSlot = null; scheduleAck = false;
      selectedPronouns = new Set(d.pronouns || []);
      selectedRoles = new Set(d.roles || []);
      selectedCrew = new Set(d.crew || []);
      anyPart = d.anyPart || null;
      el.innerHTML = `<div class="hint" style="margin-top:10px;">Pick a new time below — your current slot (${d.slotLabel}) stays reserved until you confirm the new one.</div>`;
      await loadTaken();
      render();
      document.getElementById('app').scrollIntoView({behavior:'smooth'});
    });
  }
}

async function runManageSearch(){
  const codeInput = document.getElementById('manage-code');
  const code = codeInput.value.trim();
  const el = document.getElementById('manage-result');
  if(!code){
    el.innerHTML = `<div class="hint" style="color:var(--red-deep); margin-top:10px;">Enter a confirmation code first.</div>`;
    return;
  }
  el.innerHTML = `<div class="hint" style="margin-top:10px;">Searching…</div>`;
  const found = await findBookingByCode(code);
  renderManageResult(found);
}

document.getElementById('manage-find').addEventListener('click', runManageSearch);
